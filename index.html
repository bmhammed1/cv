  .when { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }

</style>

  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/>',
  pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  id: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h2M15 12h2M7 16h10"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[k]}</svg>`;

const entries = list => list.map(e => `
  <div class="entry">
    <div class="when">${e.when}</div>
    <div>
      <h3>${e.role}</h3>
      ${e.org ? `<div class="org">${e.org}</div>` : ""}
      ${e.text ? `<p>${e.text}</p>` : ""}
      ${e.items ? `<ul>${e.items.map(i => `<li>${i}</li>`).join("")}</ul>` : ""}
    </div>
  </div>`).join("");

function render(lang) {
  const c = CONTENT[lang] || CONTENT.fr;
  const P = PERSON;
  document.documentElement.lang = lang;
  document.documentElement.dir = c.dir;
  document.title = c.docTitle;

  document.getElementById("cv").innerHTML = `
    <aside>
      <div class="avatar">${P.photo ? `<img src="${P.photo}" alt="">` : P.initials}</div>

      <h2>${c.h.contact}</h2>
      <ul class="contact">
        <li>${svg("phone")}<span dir="ltr">${P.phone}</span></li>
        <li>${svg("mail")}<span dir="ltr">${P.email}</span></li>
        <li>${svg("pin")}<span>${c.location}</span></li>
        <li>${svg("link")}<span dir="ltr">${P.linkedin}</span></li>
        <li>${svg("id")}<span dir="ltr">${P.cnom}<br>${P.inpe}</span></li>
      </ul>

      <h2>${c.h.skills}</h2>
      <ul class="skills">${c.skills.map(s => `<li>${s}</li>`).join("")}</ul>

      <h2>${c.h.languages}</h2>
      <ul class="lang">${c.languages.map(([l, v], i) => `
        <li><div class="row"><span>${l}</span><span class="lvl">${v}</span></div>
        <div class="bar"><i style="width:${P.langLevels[i] ?? 50}%"></i></div></li>`).join("")}
      </ul>

      <h2>${c.h.it}</h2>
      <ul class="tags">${c.it.map(s => `<li>${s}</li>`).join("")}</ul>

      <h2>${c.h.interests}</h2>
      <ul class="tags">${c.interests.map(s => `<li>${s}</li>`).join("")}</ul>
    </aside>

    <main>
      <header class="top">
        <h1 class="name">${c.name}</h1>
        <p class="title">${c.title}</p>
        <p class="subtitle">${c.subtitle}</p>
      </header>

      <h2>${c.h.profile}</h2>
      <p class="summary">${c.profile}</p>

      <h2>${c.h.experience}</h2>
      ${entries(c.experience)}

      <h2>${c.h.education}</h2>
      ${entries(c.education)}

      <h2>${c.h.certs}</h2>
      ${entries(c.certs)}

      <h2>${c.h.pubs}</h2>
      <ol class="pubs">${c.pubs.map(p => `<li>${p}</li>`).join("")}</ol>

      <h2>${c.h.memberships}</h2>
      ${entries(c.memberships)}

      <footer class="note">${c.note}</footer>
    </main>`;

  document.querySelectorAll("[data-lang]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem("cv-lang", lang); } catch (e) {}
}

function initialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && CONTENT[q]) return q;
  try { const s = localStorage.getItem("cv-lang"); if (s && CONTENT[s]) return s; } catch (e) {}
  return "fr"; // Français par défaut
}

document.querySelectorAll("[data-lang]").forEach(b =>
  b.addEventListener("click", () => {
    render(b.dataset.lang);
    history.replaceState(null, "", "?lang=" + b.dataset.lang);
  }));
document.getElementById("printBtn").addEventListener("click", () => window.print());

render(initialLang());
</script>
</body>
</html>
